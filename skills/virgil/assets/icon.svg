<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Virgil Security Skill Icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111821" />
      <stop offset="100%" stop-color="#090D12" />
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3FE0A8" />
      <stop offset="100%" stop-color="#1D9A6C" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152822" />
      <stop offset="100%" stop-color="#0C1714" />
    </linearGradient>
  </defs>

  <!-- Outer rounded container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#212D3B" stroke-width="2" />

  <!-- Concentric scan rings -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#2AB985" stroke-opacity="0.14" stroke-width="1.25" />
  <circle cx="64" cy="64" r="35" fill="none" stroke="#2AB985" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Cardinal astrolabe crosshairs -->
  <line x1="64" y1="14" x2="64" y2="23" stroke="#2AB985" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" />
  <line x1="64" y1="105" x2="64" y2="114" stroke="#2AB985" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" />
  <line x1="14" y1="64" x2="23" y2="64" stroke="#2AB985" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" />
  <line x1="105" y1="64" x2="114" y2="64" stroke="#2AB985" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" />

  <!-- Outer detection arcs (Red & Yellow telemetry ticks) -->
  <path d="M 32 32 A 46 46 0 0 1 56 18.7" fill="none" stroke="#F85149" stroke-width="2.25" stroke-linecap="round" />
  <circle cx="32" cy="32" r="3" fill="#F85149" />
  <path d="M 96 96 A 46 46 0 0 1 72 109.3" fill="none" stroke="#D29922" stroke-width="2.25" stroke-linecap="round" />
  <circle cx="96" cy="96" r="3" fill="#D29922" />

  <!-- Stylized laurel chevron wings -->
  <path d="M 28 74 C 24 60, 27 46, 36 39" fill="none" stroke="#2AB985" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 33 82 C 28 71, 29 59, 35 50" fill="none" stroke="#2AB985" stroke-opacity="0.35" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 100 74 C 104 60, 101 46, 92 39" fill="none" stroke="#2AB985" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 95 82 C 100 71, 99 59, 93 50" fill="none" stroke="#2AB985" stroke-opacity="0.35" stroke-width="1.8" stroke-linecap="round" />

  <!-- Central Virgil Sentinel Shield -->
  <path d="M 64 25 L 89 35 V 61 C 89 79 77.5 92.5 64 99 C 50.5 92.5 39 79 39 61 V 35 Z"
        fill="url(#shieldFill)" stroke="url(#emerald)" stroke-width="2.75" stroke-linejoin="round" />

  <!-- Inner lantern beacon / V-crest -->
  <path d="M 51 47 L 64 78 L 77 47" fill="none" stroke="url(#emerald)" stroke-width="4.25" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="64,37 70,45 64,53 58,45" fill="#3FE0A8" />
  <line x1="64" y1="84" x2="64" y2="90" stroke="#2AB985" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" />
</svg>
